name: benchmate
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - tesseract=5.3.1
  - cuda-toolkit
  - mmseqs2
  - fpocket
  - foldseek
  - folddisco
  - clustalo
  - blast
  - viennarna
  - python=3.12
  - "postgresql>=17"
  - pip
  - pip:
      - torch
      - torchvision
      - transformers
      - sentence-transformers
      - qwen_vl_utils
      - accelerate
      - requests
      - pandas==2.1.4
      - biopython
      - beautifulsoup4
      - SQLAlchemy==1.4.54
      - rdkit
      - biotite
      - alphagenome
      - model2vec
      - psycopg2-binary
      - bitsandbytes
      - chonkie[st]==0.3.0
      - lxml
      - pysam
      - pgvector
      - pydantic
      - xmltodict
      - kneed
      - paddleocr[all]
